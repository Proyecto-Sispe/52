<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="Logo 2.png" type="image/png">
    <link rel="stylesheet" href="Registro.Css">
    <title>Registro Usuario</title>
</head>
<body>
<nav>
  <ul class="menu">
    <li class="logo">
      <img src="Logo 2.png" alt="Logo">
    </li>
    <li><a href="Inicio.html">Inicio</a></li>
    <li><a href="Persona.Html">Personas</a></li>
    <li><a href="Mesas.Html">Mesas</a></li>
    <li><a href="Mesas 2.Html">Gestion de Mesas</a></li>
    <li><a href="Menu.html">Menú</a></li>
    <li><a href="Productos.html">Productos</a></li>
    <li><a href="Factura.HTML">Facturas</a></li>
    <li><a href="Pedidos.Html">Pedidos</a></li>
    <li class="right"><a href="Inicio de Sesion.Html">Login</a></li>
  </ul>
</nav>
<section class="formulario">
  <h2>Registrar Nueva Persona</h2>
  <div class="grid-form">
    <div>
      <label for="doc">Tipo de Documento</label>
      <select id="doc">
        <option>Cédula de Ciudadanía</option>
        <option>Tarjeta de Identidad</option>
        <option>Cédula de Extranjería</option>
      </select>
    </div>
    <div>
      <label for="rol">Rol</label>
      <select id="rol">
        <option>Administrador</option>
        <option>Empleado</option>
      </select>
    </div>
    <div>
      <label for="id">Número de Identificación</label>
      <input type="text" id="id">
    </div>
    <div>
      <label for="nombre1">Primer Nombre</label>
      <input type="text" id="nombre1">
    </div>
    <div>
      <label for="nombre2">Segundo Nombre</label>
      <input type="text" id="nombre2">
    </div>
    <div>
      <label for="apellido1">Primer Apellido</label>
      <input type="text" id="apellido1">
    </div>
    <div>
      <label for="apellido2">Segundo Apellido</label>
      <input type="text" id="apellido2">
    </div>
    <div>
      <label for="email">Email</label>
      <input type="email" id="email">
    </div>
    <div>
      <label for="password">Telefono</label>
      <input type="password" id="password">
    </div>
    <div>
      <label for="confirm">Contraseña</label>
      <input type="password" id="confirm">
    </div>
  </div>
  <div class="acciones">
    <button class="cancelar" type="button">Cancelar</button>
    <button id="guardar" type="button" class="guardar" onclick="ValidateForm()">Guardar</button>
  </div>
</section>
</body>
<script>
    let cancelarBtn = document.querySelector(".cancelar");
    cancelarBtn.addEventListener("click", function() {
        alert("Registro cancelado.");
    });
    function ValidateForm() {
        let email = document.getElementById("email").value;
        let password = document.getElementById("password").value;
        let confirm = document.getElementById("confirm").value;
        if (email === "" || password === "" || confirm === "") {
            alert("Por favor, complete todos los campos.");
            return false;
        }
        if (password !== confirm) {
            alert("Las contraseñas no coinciden.");
            return false;
        }
        return true;
    }
</script>
</html>
