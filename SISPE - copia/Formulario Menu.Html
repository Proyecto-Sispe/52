<section class="formulario-producto">
  <h2>Agregar Producto/Editar Producto</h2>
  <form class="grid-form">
    <div>
      <label>Categoría</label>
      <select>
        <option>Hamburguesas</option>
        <option>Perros calientes</option>
        <option>Gaseosas</option>
      </select>
    </div>
    <div>
      <label>ID</label>
      <input type="number" placeholder="Ej: 1">
    </div>
    <div>
      <label>Producto</label>
      <input type="text" placeholder="Ej: Hamburguesa">
    </div>
    <div>
      <label>Precio</label>
      <input type="number" placeholder="Ej: 15000">
    </div>
    <div class="full">
      <label>Descripción</label>
      <input type="text" placeholder="Descripción del producto">
    </div>
  </form>
  <div class="acciones">
    <button class="cancelar">Cancelar</button>
    <button class="guardar">Guardar</button>
  </div>
</section>
</body>
