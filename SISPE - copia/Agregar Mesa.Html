<section class="formulario-mesa">
  <h2>Registrar Nueva Mesa</h2>
  <form class="grid-form">
    <div>
      <label>Número de Mesa</label>
      <input type="number" placeholder="Ingresar número de mesa">
    </div>
    <div>
      <label>Estado</label>
      <select>
        <option>Libre</option>
        <option>Ocupada</option>
        <option>Reservada</option>
      </select>
    </div>
    <div>
      <label>Capacidad</label>
      <input type="number" placeholder="Ingresar personas">
    </div>
    <div>
      <label>Ubicación</label>
      <input type="text" placeholder="Ingresar Ubicacion">
    </div>
  </form>
  <div class="acciones">
    <a href="Mesas 2.Html"><button class="cancelar">Cancelar</button></a>
    <a href="Mesas 2.Html"><button class="guardar">Guardar</button></a>
  </div>
