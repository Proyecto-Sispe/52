</head>
<body>
<nav>
  <ul class="menu">

      <img src="Logo 2.png" alt="Logo">

  </ul>
</nav>
<section class="formulario-mesa">
  <h2>Registrar Nuevo Pedido</h2>
  <form class="grid-form">
    <div>
      <label>Id Factura</label>
      <input type="number" placeholder="Ingrese un numero de factura unico">
    </div>
    <div>
      <label>Id Menu</label>
      <input type="text" placeholder="Ingrese el menu">
    </div>
    <div>
      <label>Cantidad</label>
      <input type="number" placeholder="Ingrese la cantidad">
    </div>
    <div>
      <label>Descripcion</label>
      <input type="text" placeholder="Ingrese la descripcion">
    </div>
    <div>
      <label>Numero Mesa</label>
      <input type="number" placeholder="Ingrese el numero de la mesa">
    </div>
    <div>
        <label>Documento</label>
        <input type="number" placeholder="Ingrese el precio">
    </div>
    <div>
        <label>Id Mesero</label>
        <select>
            <option>Mesero 1</option>
            <option>Mesero 2</option>
            <option>Mesero 3</option>
        </select>
    </div>
    <div>
        <label>Valor Total</label>
        <input type="number" placeholder="Ingrese el valor total de la factura">
    </div>
  </form>
  <div class="acciones">
    <a href="Mesas 2.Html"><button class="cancelar">Cancelar</button></a>
    <a href="Mesas 2.Html"><button class="guardar">Guardar</button></a>
  </div>
</section>
</body>
</html>
